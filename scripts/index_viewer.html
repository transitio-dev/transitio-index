<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>transitio index viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css"
      integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"
        integrity="sha384-SYKAG6cglRMN0RVvhNeBY0r3FYKNOJtznwA0v7B5Vp9tr31xAHsZC0DqkQ/pZDmj" crossorigin="anonymous"></script>
<style>
  html, body { height: 100%; margin: 0; font: 14px/1.4 system-ui, sans-serif; color: #111; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; padding: 0.5rem 1rem; border-bottom: 1px solid #ddd; background: #fafafa; }
  header label { font-weight: 600; }
  header select { margin-left: 0.5rem; max-width: 24rem; }
  #stats { color: #444; }
  #hint { padding: 0.15rem 0.6rem; border-radius: 0.3rem; background: #fde68a; color: #4a3600; }
  #body { flex: 1; display: flex; min-height: 0; }
  #map { flex: 1; min-height: 0; }
  #panel { width: 28rem; max-width: 45vw; overflow: auto; border-left: 1px solid #ddd; padding: 0 0.75rem 0.75rem; }
  #panel nav { display: flex; gap: 0.25rem; margin: 0.5rem 0; }
  #panel nav button { border: 1px solid #ccc; background: #f3f4f6; padding: 0.2rem 0.7rem; border-radius: 0.3rem; cursor: pointer; }
  #panel nav button.active { background: #2563eb; border-color: #2563eb; color: #fff; }
  .muted { color: #666; }
  .chain button.crumb { border: none; background: none; color: #2563eb; padding: 0; cursor: pointer; font: inherit; }
  .filters { display: flex; gap: 0.4rem; margin-bottom: 0.4rem; }
  .filters input { flex: 1; min-width: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { text-align: left; padding: 0.15rem 0.35rem; border-bottom: 1px solid #eee; white-space: nowrap; }
  th[data-sort] { cursor: pointer; user-select: none; }
  #places-table tbody tr { cursor: pointer; }
  #places-table tbody tr:hover { background: #eef2ff; }
  .table-wrap { overflow: auto; }
  .pager { display: flex; gap: 0.5rem; align-items: center; justify-content: flex-end; margin-top: 0.4rem; }
  .tree, .tree ul { list-style: none; margin: 0; padding-left: 1rem; }
  .tree li { line-height: 1.6; }
  .tree li[aria-selected] > .node { background: #dbeafe; border-radius: 0.2rem; }
  .tree .caret { width: 1.2rem; border: none; background: none; cursor: pointer; color: #555; display: inline-block; }
  .tree .node { border: none; background: none; font: inherit; cursor: pointer; padding: 0 0.2rem; }
  .tree .node.unserved { color: #777; }
  .tree .kind { color: #888; margin-left: 0.3rem; }
  .maplibregl-popup-content { font: 13px/1.4 system-ui, sans-serif; }
  .maplibregl-popup-content ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }
</style>
</head>
<body>
<header>
  <label>Build <select id="build"></select></label>
  <span id="stats"></span>
  <span id="hint" hidden></span>
</header>
<div id="body">
  <div id="map"></div>
  <aside id="panel">
    <nav>
      <button type="button" data-tab="details" class="active">Details</button>
      <button type="button" data-tab="places">Places</button>
      <button type="button" data-tab="tree">Tree</button>
    </nav>
    <section id="details" class="tab"><p class="muted">Click a place on the map, or a row under Places.</p></section>
    <section id="places" class="tab" hidden>
      <div class="filters">
        <input id="places-search" type="search" placeholder="Name contains…">
        <select id="places-kind"><option value="">any kind</option><option value="country">country</option><option value="region">region</option><option value="city">city</option></select>
        <select id="places-served"><option value="">served or not</option><option value="true">served</option><option value="false">unserved</option></select>
      </div>
      <div class="table-wrap"><table id="places-table"><thead><tr></tr></thead><tbody></tbody></table></div>
      <div class="pager"><button type="button" id="places-prev">‹</button><span id="places-count"></span><button type="button" id="places-next">›</button></div>
    </section>
    <section id="tree" class="tab" hidden><ul id="tree-root" class="tree"></ul></section>
  </aside>
</div>
<script type="module" src="/static/index_viewer.mjs"></script>
</body>
</html>
