# The feed index build tool. It runs from a checkout rather than being
# published to PyPI: this file declares the project's metadata, its
# dependencies and the `transitio_index` package, installed editable so the
# build modules and their `python -m` entry points are importable.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "transitio-index"
description = "The feed index build for transitio"
authors = [{ name = "Henrikki Tenkanen" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
version = "0.1.0"
dependencies = [
    # The reader the build writes for: its release contract, schema floors
    # and fingerprint. Released to PyPI; schema 6 ships from 0.11.
    "transitio>=0.11",
    # The build's own libraries, owned here rather than through transitio's
    # extra: GeoParquet and geometry, the crawl's HTTP, the Eurostat workbook
    # and the override YAML. Floors match transitio's.
    "geopandas>=0.14",
    "httpx>=0.27",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "shapely>=2.0",
]
classifiers = [
    # A maintainer tool, not for PyPI; this classifier makes PyPI and twine
    # refuse an upload, so the build cannot be published beside the reader.
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
viewer = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["transitio_index"]

[tool.black]
include = '(transitio_index|tests|scripts)/.*\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
